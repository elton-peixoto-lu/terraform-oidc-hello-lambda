name: ci-plan

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  dummy-test:
    name: dummy-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

  terraform-plan:
    name: terraform-plan
    runs-on: ubuntu-latest
    needs: dummy-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform fmt bootstrap
        working-directory: infra/bootstrap
        run: terraform fmt -check -recursive

      - name: Terraform init bootstrap
        working-directory: infra/bootstrap
        run: terraform init -backend=false

      - name: Terraform validate bootstrap
        working-directory: infra/bootstrap
        run: terraform validate

      - name: Terraform init local fallback
        if: ${{ vars.AWS_ROLE_PLAN_ARN == '' || vars.AWS_REGION == '' || vars.TF_STATE_BUCKET == '' || vars.TF_LOCK_TABLE == '' || vars.TF_STATE_KMS_KEY_ID == '' }}
        working-directory: infra/envs/prod
        run: terraform init -backend=false

      - name: Configure AWS credentials via OIDC
        if: ${{ vars.AWS_ROLE_PLAN_ARN != '' && vars.AWS_REGION != '' && vars.TF_STATE_BUCKET != '' && vars.TF_LOCK_TABLE != '' && vars.TF_STATE_KMS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PLAN_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        if: ${{ vars.AWS_ROLE_PLAN_ARN != '' && vars.AWS_REGION != '' && vars.TF_STATE_BUCKET != '' && vars.TF_LOCK_TABLE != '' && vars.TF_STATE_KMS_KEY_ID != '' }}
        working-directory: infra/envs/prod
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ID }}" \
            -backend-config="encrypt=true"

      - name: Terraform fmt
        working-directory: infra/envs/prod
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infra/envs/prod
        run: terraform validate

      - name: Terraform plan local fallback
        if: ${{ vars.AWS_ROLE_PLAN_ARN == '' || vars.AWS_REGION == '' || vars.TF_STATE_BUCKET == '' || vars.TF_LOCK_TABLE == '' || vars.TF_STATE_KMS_KEY_ID == '' }}
        working-directory: infra/envs/prod
        run: terraform plan -input=false -refresh=false -no-color

      - name: Terraform plan
        if: ${{ vars.AWS_ROLE_PLAN_ARN != '' && vars.AWS_REGION != '' && vars.TF_STATE_BUCKET != '' && vars.TF_LOCK_TABLE != '' && vars.TF_STATE_KMS_KEY_ID != '' }}
        working-directory: infra/envs/prod
        run: terraform plan -input=false -no-color
